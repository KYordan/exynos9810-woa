name: S10e touch drivers (HSI2C + S6SY761)

# Galaxy S10e (Exynos 9820) touchscreen under Windows: the HSI2C SpbCx controller driver (ACPI\SAMS9820: HSI2C
# window only, the UEFI's B2LTouchDxe has set clocks, USI mode and pins) and the S6SY761 HID driver (ALIVE GPIO at
# 0x15850000, GPA1 at 0x020, touch functions with GLOVE). Both are this repository's code; the artifact is plain.

on:
  workflow_dispatch:
  push:
    branches: [s10e]
    paths:
      - 'drivers/Exynos9810Hsi2c/**'
      - 'drivers/S6SY761Touch/**'
      - 'drivers/sign-test-packages.ps1'
      - '.github/workflows/build-s10e-touch.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: MSBuild
        uses: microsoft/setup-msbuild@v2

      # The runner's WDK 26100 cannot run InfVerif (x86\InfVerif.dll missing) or ApiValidator (exit 193) after an
      # ARM64 link; both are post-build checks, so they are switched off and the job checks the outputs instead.
      - name: Build the HSI2C controller driver (ARM64)
        shell: pwsh
        run: |
          msbuild drivers/Exynos9810Hsi2c/Exynos9810Hsi2c.vcxproj /p:Configuration=Release /p:Platform=ARM64 `
            "/p:OutDir=$PWD\out\build\hsi2c\" /p:SignMode=Off `
            /p:ApiValidator_Enable=false /p:EnableInfVerif=false /p:RunInfVerif=false /nologo /v:minimal `
            "/flp:logfile=$PWD\out\hsi2c-errors.log;errorsonly"
          $code = $LASTEXITCODE
          Get-ChildItem out/build/hsi2c -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::notice::built $($_.FullName)" }
          if (-not (Get-ChildItem out/build/hsi2c -Recurse -Filter Exynos9810Hsi2c.sys -ErrorAction SilentlyContinue)) {
            Get-Content out/hsi2c-errors.log -ErrorAction SilentlyContinue | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          if ($code -ne 0) {
            Get-Content out/hsi2c-errors.log -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Output "::warning::$_" }
          }
          exit 0

      - name: Build the S6SY761 touch driver (ARM64)
        shell: pwsh
        run: |
          msbuild drivers/S6SY761Touch/S6SY761Touch.vcxproj /p:Configuration=Release /p:Platform=ARM64 `
            "/p:OutDir=$PWD\out\build\touch\" /p:SignMode=Off `
            /p:ApiValidator_Enable=false /p:EnableInfVerif=false /p:RunInfVerif=false /nologo /v:minimal `
            "/flp:logfile=$PWD\out\touch-errors.log;errorsonly"
          $code = $LASTEXITCODE
          if (-not (Get-ChildItem out/build/touch -Recurse -Filter S6SY761Touch.sys -ErrorAction SilentlyContinue)) {
            Get-Content out/touch-errors.log -ErrorAction SilentlyContinue | Select-Object -First 15 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          if ($code -ne 0) {
            Get-Content out/touch-errors.log -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Output "::warning::$_" }
          }
          exit 0

      - name: Packages, catalogs, test signature
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/pkg/hsi2c, out/pkg/touch | Out-Null
          $hsi2cInf = Get-ChildItem out/build/hsi2c, drivers/Exynos9810Hsi2c -Recurse -Filter Exynos9810Hsi2c.inf |
            Select-Object -First 1
          $hsi2cSys = Get-ChildItem out/build/hsi2c -Recurse -Filter Exynos9810Hsi2c.sys | Where-Object FullName -notmatch '\\obj\\' | Select-Object -First 1
          $touchSys = Get-ChildItem out/build/touch -Recurse -Filter S6SY761Touch.sys | Select-Object -First 1
          if (-not $hsi2cInf -or -not $hsi2cSys -or -not $touchSys) { Get-ChildItem out/build -Recurse | Out-Host; exit 1 }
          Copy-Item $hsi2cInf.FullName, $hsi2cSys.FullName out/pkg/hsi2c/
          Copy-Item $touchSys.FullName, drivers/S6SY761Touch/S6SY761Touch.inf out/pkg/touch/
          ./drivers/sign-test-packages.ps1 -Packages out/pkg/hsi2c, out/pkg/touch

      - uses: actions/upload-artifact@v4
        with:
          name: s10e-touch-${{ github.run_number }}
          path: out/pkg
          if-no-files-found: error
          retention-days: 30
